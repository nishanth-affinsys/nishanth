<html>
 <head>
  <style type="text/css">
      @page {
        size: A4;
        margin: 15mm;
        @frame header_frame {
            -pdf-frame-content: header_content;
            top: 10pt;
        }
        @frame footer_frame {
            -pdf-frame-content: footer_content;
            top:  800pt;
        }
      }
    table{table-layout:fixed;word-break:break-word;border-collapse: collapse;border: 1px solid black;margin: auto;width: 80%;}
    th{font-size:7px;page-break-inside: auto;text-align: center;border: 1px solid black;padding: 3px 0px 3px ;-pdf-word-wrap: CJK;}
    td{font-size:7px;page-break-inside: auto;text-align: center;border: 1px solid black;padding: 3px 0px 3px;-pdf-word-wrap: CJK;}
    h1{width: 100%;text-align: center;}
    #footer_content { display: flex; justify-content: space-between; align-items: center; }
    @font-face {
            font-family: DejaVuSans;
            src: url('DejaVuSans.ttf');
        }
        body{
            font-family: DejaVuSans, Arial, sans-serif; /* Fallback fonts */
        }
  </style>
   <title>{{ Filename }}</title>
 </head>
 <body>
    <div id="header_content" style="display: flex; justify-content: space-between;">
        <h6 style="text-align: right; font-weight: normal; margin: 5mm;">Generated on {{ Timestamp }} by user {{ User }} </h6>
    </div>
    <h1>{{ Title }}</h1>
        <table class="tg">
        <tr>
            {% for col_name in Fields %}
                <th>{{ col_name }}</th>
            {% endfor %}
        </tr>
        {% for a in Objs %}
            <tr>
            {% for k,v in a.items %}
                <td>{{ v }}</td>
            {% endfor %}
            </tr>
        {% endfor %}
        </table>
    <div id="footer_content" style="text-align: center;">Page <pdf:pagenumber>
    of <pdf:pagecount>
<div id=footer_content" style="text-align: center;">CONFIDENTIAL</div>
</div>
 </body>
</html>
