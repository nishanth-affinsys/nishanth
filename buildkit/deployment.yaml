apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  namespace: buildkit
  labels:
    app: buildkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkit
  template:
    metadata:
      labels:
        app: buildkit
    spec:
      serviceAccountName: buildkit
      containers:
      - name: buildkit
        image: moby/buildkit:latest
        args:
        - --addr
        - unix:///run/buildkit/buildkitd.sock
        - --addr
        - tcp://0.0.0.0:1234
        securityContext:
          privileged: true
        ports:
        - containerPort: 1234
          name: buildkit
          protocol: TCP
        volumeMounts:
        - name: buildkit-socket
          mountPath: /run/buildkit
        readinessProbe:
          exec:
            command:
            - buildctl
            - debug
            - workers
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - buildctl
            - debug
            - workers
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: buildkit-socket
        emptyDir: {}
